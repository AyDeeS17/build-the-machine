name: Integrate Rules Section
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message != 'Integrate Rules section into dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Rules into dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'id="rulesBtn"' in s:
              raise SystemExit(0)
          nav='<button class="btn" id="rulesBtn"><span class="nav-icon">⚖</span> RULES</button>'
          s=s.replace('<button class="btn" id="progressBtn"><span class="nav-icon">▂▅▇</span> PROGRESS</button>', '<button class="btn" id="progressBtn"><span class="nav-icon">▂▅▇</span> PROGRESS</button>'+nav)
          s=s.replace('</main><script>', '</main><script src="./rules.js"></script><script>')
          p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Rules section into dashboard"
          git push
