name: Restore dashboard sections
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired character renderer without touching the dashboard shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-shell.js')
          s=p.read_text()
          s=s.replace('enhanceTraining();','')
          marker='function enhanceTraining(){'
          while marker in s:
              start=s.index(marker)
              brace=s.index('{', start)
              depth=0
              end=None
              for i in range(brace, len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          end=i+1
                          break
              if end is None:
                  raise SystemExit('Could not safely remove enhanceTraining')
              s=s[:start]+s[end:]
          import re
          s=re.sub(r'const CHARS=\[[^;]*\];','',s)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app-shell.js
          git diff --cached --quiet || git commit -m "Remove retired character renderer safely"
          git push
