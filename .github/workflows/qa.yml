name: Build The Machine QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-shell.js
          node --check training-config.js
          node --check ripple.js
          node --check running-polish.js
          node --check nav-reorder.js
          node --check rules.js
          node --check ui-polish.js
          node --check training-readability.js
          node --check reset-ui-cleanup.js
          node --check week-consistency.js
          node --check training-app/app.js
          node --check training-app/sw.js
      - name: Check Week configuration
        run: |
          node --check week-config.js
          grep -q "rank: 'NOVICE'" week-config.js
          grep -q "rank: 'LEGEND'" week-config.js
          grep -q "id: 7, rank: 'RECOVERY'.*isDeload: true" week-config.js
      - name: Verify 12-week progressive overload model
        run: |
          node <<'NODE'
          global.window={};
          require('./training-config.js');
          const p=window.BTM_TRAINING_WEEKS;
          const weeks=Object.keys(p).map(Number).sort((a,b)=>a-b);
          if(weeks.length!==12 || weeks.some((w,i)=>w!==i+1)) throw new Error('Training weeks must be exactly 1–12');
          const totalSets=w=>p[w].days.reduce((n,d)=>n+d.exercises.reduce((m,e)=>m+e.sets,0),0);
          const signatures=weeks.map(w=>JSON.stringify(p[w]));
          if(new Set(signatures).size!==12) throw new Error('Duplicate full-week prescriptions detected');
          if(!p[7].deload) throw new Error('Week 7 is not marked as deload');
          if(totalSets(7)>=totalSets(6) || totalSets(7)>=totalSets(8)) throw new Error('Week 7 is not a true volume deload');
          if(totalSets(8)<=totalSets(7)) throw new Error('Week 8 did not resume workload');
          if(JSON.stringify(p[1])===JSON.stringify(p[12])) throw new Error('Week 12 is identical to Week 1');
          for(const w of weeks){
            for(const d of p[w].days){
              for(const e of d.exercises){
                if(!Number.isInteger(e.sets) || e.sets<2 || e.sets>4) throw new Error(`Invalid sets in Week ${w}, ${e.name}`);
                if(e.rir<1 || e.rir>4) throw new Error(`Invalid RIR in Week ${w}, ${e.name}`);
                if(!e.reps || !e.variation) throw new Error(`Incomplete prescription in Week ${w}, ${e.name}`);
              }
            }
          }
          const rirAvg=w=>{const a=[];p[w].days.forEach(d=>d.exercises.forEach(e=>a.push(e.rir)));return a.reduce((x,y)=>x+y,0)/a.length};
          if(!(rirAvg(1)>rirAvg(6) && rirAvg(7)>rirAvg(6) && rirAvg(7)>rirAvg(8) && rirAvg(8)>rirAvg(12))) throw new Error('RIR progression sanity check failed');
          console.log('Progression QA passed:', weeks.map(w=>`W${w}=${totalSets(w)} sets, avgRIR=${rirAvg(w).toFixed(2)}`).join(' | '));
          NODE
      - name: Verify standalone iPhone training app
        run: |
          test -f training-app/index.html
          test -f training-app/app.css
          test -f training-app/app.js
          test -f training-app/manifest.webmanifest
          test -f training-app/sw.js
          grep -q 'apple-mobile-web-app-capable' training-app/index.html
          grep -q 'display.*standalone' training-app/manifest.webmanifest
          grep -q 'localStorage' training-app/app.js
          grep -q 'btm_training_exercise_completion_v2' training-app/app.js
          grep -q 'btm_training_current_week_v1' training-app/app.js
          grep -q 'navigator.serviceWorker' training-app/app.js
          grep -q 'RECOVERY · DELOAD' training-app/app.js
          ! grep -RniE 'Nutrition|Running|Sleep|Rules|food-calculator|running-polish|sleep-save|rules.js' training-app --exclude='*.map'
      - name: Check navigation contract
        run: |
          grep -q 'id="trainingBtn"' index.html
          grep -q 'id="runningBtn"' index.html
          grep -q 'id="foodBtn"' index.html
          grep -q 'id="sleepBtn"' index.html
          grep -q 'id="progressBtn"' index.html
          grep -q 'id="rulesBtn"' index.html
          grep -q 'btm-navigation-order-v1' nav-reorder.js
      - name: Check running schedule contract
        run: |
          grep -q 'ACTIVE_DAYS=new Set(\[0,2,4\])' running-polish.js
          grep -q 'btm_running_non_training_backup_v1' running-polish.js
      - name: Check training readability layer
        run: |
          grep -q 'training-prescription' training-readability.js
          grep -q 'training-rir' training-readability.js
      - name: Check reset UI contract
        run: |
          grep -q 'btm-universal-reset' rules.js
          grep -q 'btmResetHeat' rules.js
          grep -q 'section.*rules.*progress\|s===.rules.\|s===.progress.' rules.js
          grep -q 'resetWeekBtn' reset-ui-cleanup.js
          grep -q 'btm-inline-emblem' reset-ui-cleanup.js
      - name: Check removed MACHINE effects stay removed
        run: |
          ! grep -RniE 'gavel|rules-gavel|gavel-anchor|MACHINE section marker|h1 span::after' --exclude-dir=.git --exclude='qa.yml' .
      - name: Check legacy character system is gone
        run: |
          ! grep -RniE 'Goku|Tanjiro Kamado|Yuji Itadori|Eren Yeager|Thorfinn|Vegeta|Gojo Satoru|Toji Fushiguro|Ken Kaneki|Itachi Uchiha|Griffith|Guts|ANIME PROGRESSION|ANIME CHARACTER|MANGA PROGRESSION' --exclude-dir=.git --exclude='qa.yml' .
