name: Fix site element references
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make DOM references explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="let state=JSON.parse(localStorage.getItem('btm_progress')||'{}'),week=1;"
          inject="const weeks=document.getElementById('weeks'),workouts=document.getElementById('workouts'),sx=document.getElementById('sx'),sc=document.getElementById('sc'),ss=document.getElementById('ss'),sw=document.getElementById('sw'),score=document.getElementById('score'),nt=document.getElementById('nt'),nf=document.getElementById('nf'),training=document.getElementById('training'),food=document.getElementById('food'),cal=document.getElementById('cal'),pro=document.getElementById('pro'),carb=document.getElementById('carb'),fat=document.getElementById('fat'),meals=document.getElementById('meals'),items=document.getElementById('items'),savefood=document.getElementById('savefood'),foodmsg=document.getElementById('foodmsg');"
          if inject not in s:
            s=s.replace(marker,marker+inject)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Fix website DOM initialization" && git push)
