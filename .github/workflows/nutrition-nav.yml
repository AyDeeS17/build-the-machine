name: Connect nutrition tracker
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect Food tab to 84-day tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- BTM-NUTRITION-LINK -->'
          script='''<script id="btm-nutrition-link">document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('foodBtn');if(b){b.addEventListener('click',()=>{window.location.href='nutrition.html'})}});</script>'''
          if marker not in s:
              s=s.replace('</body>',marker+script+'</body>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Connect Food tab to full 84-day nutrition tracker" && git push)
