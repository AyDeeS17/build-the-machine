name: Load Build The Machine extensions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load extensions into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for src in ['enhancements.js','ui-polish.js']:
              tag=f'<script src="{src}"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s)
          PY
      - name: Commit extension loader
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Load running sleep progress and UI extensions" && git push)
