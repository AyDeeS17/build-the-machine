<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build The Machine · Nutrition</title><style>body{margin:0;background:#071016;color:#e8f0f4;font:16px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.08em}.muted{color:#8195a3}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab,.day{background:#0f1a22;color:#e8f0f4;border:1px solid #294656;border-radius:8px;padding:10px;cursor:pointer}.tab.active,.day.active{border-color:#66b9df;background:#173247}.week{margin:22px 0;border:1px solid #294656;border-radius:10px;padding:14px;background:#0d171e}.week h2{margin:0 0 12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{text-align:left}.day small,.day b{display:block}.day small{color:#8195a3;margin-top:4px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.field label{display:block;color:#8195a3;font-size:11px;margin-bottom:5px}.field input,.field textarea{width:100%;box-sizing:border-box;background:#09131a;border:1px solid #294656;border-radius:6px;padding:10px;color:#e8f0f4}.field textarea{min-height:90px}.wide{grid-column:1/-1}.save{margin-top:12px;background:#66b9df;border:0;padding:11px 15px;border-radius:6px;font-weight:800;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.stat{border:1px solid #294656;border-radius:8px;padding:12px;background:#0f1a22}.stat b{display:block;font-size:20px}.stat span{color:#8195a3;font-size:10px}@media(max-width:800px){.days{grid-template-columns:repeat(4,1fr)}.form{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:500px){.days{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand">BUILD THE MACHINE</div><div class="muted">12-WEEK NUTRITION TRACKER</div></div><div class="muted">84 DAYS</div></div><div id="weeks"></div><section class="week"><h2 id="selectedDate">Select a day</h2><div class="muted" id="targets"></div><div class="form"><div class="field"><label>CALORIES</label><input id="cal" type="number"></div><div class="field"><label>PROTEIN (G)</label><input id="protein" type="number"></div><div class="field"><label>CARBS (G)</label><input id="carbs" type="number"></div><div class="field"><label>FATS (G)</label><input id="fats" type="number"></div><div class="field"><label>WATER (L)</label><input id="water" type="number" step="0.1"></div><div class="field"><label>COMPLETED?</label><select id="complete" style="width:100%;padding:10px;background:#09131a;color:#e8f0f4;border:1px solid #294656;border-radius:6px"><option value="no">Not completed</option><option value="yes">Completed</option></select></div><div class="field wide"><label>MEALS / FOOD CONSUMED</label><textarea id="meals"></textarea></div></div><button class="save" id="save">SAVE DAY</button><div class="summary"><div class="stat"><b id="weekDone">0/7</b><span>WEEK DAYS COMPLETE</span></div><div class="stat"><b id="weekCal">0</b><span>AVG CALORIES</span></div><div class="stat"><b id="weekPro">0g</b><span>AVG PROTEIN</span></div><div class="stat"><b id="overall">0%</b><span>12-WEEK COMPLETION</span></div></div></section></main><script>(()=>{const start=new Date(2026,7,10);const targets=[{c:300,f:70},{c:300,f:70},{c:310,f:70},{c:310,f:70},{c:320,f:72},{c:320,f:72},{c:270,f:68},{c:320,f:72},{c:330,f:72},{c:330,f:73},{c:340,f:74},{c:340,f:75}];let data=JSON.parse(localStorage.getItem('btm_nutrition_84')||'{}'),selected=null;const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function nice(d){return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}function days(){let out=[];for(let i=0;i<84;i++){let d=new Date(start);d.setDate(start.getDate()+i);out.push({d,i,w:Math.floor(i/7)+1})}return out}const all=days();function render(){let html='';for(let w=1;w<=12;w++){html+='<section class="week"><h2>WEEK '+w+(w===7?' · DELOAD':'')+'</h2><div class="days">';all.filter(x=>x.w===w).forEach(x=>{let k=iso(x.d),v=data[k]||{};html+='<button class="day '+(selected===k?'active':'')+'" data-k="'+k+'"><b>'+x.d.toLocaleDateString('en-US',{weekday:'short'})+'</b><small>'+x.d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</small><small>'+(v.complete==='yes'?'✓ Complete':'—')+'</small></button>'});html+='</div></section>'}$('weeks').innerHTML=html;document.querySelectorAll('.day').forEach(b=>b.onclick=()=>select(b.dataset.k));updateOverall()}function select(k){selected=k;let d=all.find(x=>iso(x.d)===k),v=data[k]||{};$('selectedDate').textContent=nice(d.d);$('targets').textContent='Week '+d.w+' target · 1800–2000 kcal · 130–160g protein · '+targets[d.w-1].c+'g carbs · '+targets[d.w-1].f+'g fats';$('cal').value=v.cal||'';$('protein').value=v.protein||'';$('carbs').value=v.carbs||'';$('fats').value=v.fats||'';$('water').value=v.water||'';$('complete').value=v.complete||'no';$('meals').value=v.meals||'';render();updateWeek(d.w)}function updateWeek(w){let rows=all.filter(x=>x.w===w).map(x=>data[iso(x.d)]||{}),done=rows.filter(x=>x.complete==='yes').length,cal=rows.filter(x=>x.cal).map(x=>+x.cal),pro=rows.filter(x=>x.protein).map(x=>+x.protein);$('weekDone').textContent=done+'/7';$('weekCal').textContent=cal.length?Math.round(cal.reduce((a,b)=>a+b,0)/cal.length):0;$('weekPro').textContent=(pro.length?Math.round(pro.reduce((a,b)=>a+b,0)/pro.length):0)+'g'}function updateOverall(){let done=all.filter(x=>(data[iso(x.d)]||{}).complete==='yes').length;$('overall').textContent=Math.round(done/84*100)+'%';if(selected){let d=all.find(x=>iso(x.d)===selected);if(d)updateWeek(d.w)}}$('save').onclick=()=>{if(!selected)return;data[selected]={cal:$('cal').value,protein:$('protein').value,carbs:$('carbs').value,fats:$('fats').value,water:$('water').value,complete:$('complete').value,meals:$('meals').value};localStorage.setItem('btm_nutrition_84',JSON.stringify(data));render();select(selected)};render();select(iso(start));})();</script></body></html>
